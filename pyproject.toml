[project]
name = "ghostdef"
version = "0.1.0"
description = "Futbol yayınları için hayalet savunma — veri hattı ve modeller"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
